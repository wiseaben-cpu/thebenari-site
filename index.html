class Component extends DCLogic {
  componentDidMount() {
    const root = this.el || document;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        const el = e.target;
        const d = parseInt(el.getAttribute('data-reveal-delay') || '0', 10);
        setTimeout(() => {
          el.style.opacity = '1';
          el.style.transform = 'translateY(0)';
        }, d);
        io.unobserve(el);
      });

      document.querySelectorAll('[data-reveal]:not([data-reveal-bound])').forEach((el) => {

        if (reduce) { el.style.opacity = '1'; return; }
        el.style.opacity = '0';
        el.style.transform = 'translateY(14px)';
        el.style.transition = 'opacity 420ms cubic-bezier(.16,.84,.44,1), transform 420ms cubic-bezier(.16,.84,.44,1)';
        io.observe(el);
      });
    };
    this._scan();
    this._mo = new MutationObserver(() => this._scan());
    this._mo.observe(document.body, { childList: true, subtree: true });

    this._initPreviews();

    this._initStage(reduce);

    const nav = document.querySelector('[data-nav]');
    this._onScroll = () => {
      if (!nav) return;
      const on = window.scrollY > 40;
      nav.style.background = on ? 'rgba(3,82,186,.9)' : 'rgba(3,82,186,0)';
      nav.style.backdropFilter = on ? 'blur(12px)' : 'none';
      nav.style.webkitBackdropFilter = on ? 'blur(12px)' : 'none';

    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._onScroll();

    this._io = io;
  }
  _initPreviews() {
    document.querySelectorAll('a [data-door]').forEach((tile) => {
      const card = tile.closest('a');
      if (!card) return;
      card.addEventListener('mouseenter', () => { tile.style.filter = 'brightness(1.08)'; });
      card.addEventListener('mouseleave', () => { tile.style.filter = 'none'; });
    });
    this._scaleFrames = () => {
      document.querySelectorAll('[data-preview]').forEach((box) => {
        const f = box.querySelector('[data-frame]');
        if (!f) return;
        const lw = parseFloat(f.getAttribute('data-w')) || 1920;
        const lh = parseFloat(f.getAttribute('data-h')) || 1080;
        f.style.width = lw + 'px';
        f.style.height = lh + 'px';
        const w = box.clientWidth;
        if (!w) return;
        f.style.transform = 'scale(' + (w / lw) + ')';
      });
    };
    this._initChatTile();

    this._muteFrames = () => {
      document.querySelectorAll('[data-frame]').forEach((f) => {
        let doc = null;
        try { doc = f.contentDocument; } catch (e) { return; }
        if (!doc) return;
        try {
          const win = f.contentWindow;
          if (win && win.HTMLMediaElement && !win.__omMuted) {
            win.HTMLMediaElement.prototype.play = function () { this.pause(); return Promise.resolve(); };
            win.__omMuted = true;
          }
        } catch (e) {}
        doc.querySelectorAll('audio,video').forEach((m) => { m.muted = true; m.volume = 0; try { m.pause(); } catch (e) {} });
      });
    };
    document.querySelectorAll('[data-frame]').forEach((f) => f.addEventListener('load', () => this._muteFrames()));
    this._muteFrames();
    this._muteTimer = setInterval(this._muteFrames, 500);

    this._scaleFrames();
    window.addEventListener('resize', this._scaleFrames);
    window.addEventListener('load', this._scaleFrames);
    if (window.ResizeObserver) {
      this._ro = new ResizeObserver(() => this._scaleFrames());
      document.querySelectorAll('[data-preview]').forEach((b) => this._ro.observe(b));
    }
  }

  _initChatTile() {
    const msgs = Array.from(document.querySelectorAll('[data-chat-msg]'));
    const typing = document.querySelector('[data-chat-typing]');
    if (!msgs.length) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const wait = (ms) => new Promise((r) => { this._chatT = setTimeout(r, ms); });
    msgs.forEach((m) => { m.style.opacity = '0'; });
    let visible = true;
    if (window.IntersectionObserver) {
      const io = new IntersectionObserver((es) => es.forEach((e) => { visible = e.isIntersecting; }), { threshold: 0.2 });
      io.observe(msgs[0].closest('[data-door]') || msgs[0]);
      this._chatIo = io;
    }
    const run = async () => {
      while (!this._chatStop) {
        if (!visible) { await wait(400); continue; }
        msgs.forEach((m) => { m.style.opacity = '0'; m.style.animation = 'none'; });
        if (typing) typing.style.display = 'none';
        await wait(500);
        for (const m of msgs) {
          if (this._chatStop) return;
          const incoming = getComputedStyle(m).alignSelf === 'flex-start';
          if (incoming && typing) {
            typing.style.display = 'flex';
            await wait(750);
            typing.style.display = 'none';
          } else {
            await wait(420);
          }
          m.style.opacity = '1';
          m.style.animation = 'chatIn 260ms cubic-bezier(.16,.84,.44,1) both';
          await wait(220);
        }
        await wait(3200);
      }
    };
    run();
  }

  _initStage(reduce) {
    const stage = document.querySelector('[data-stage]');
    if (!stage) return;
    const mark = stage.querySelector('[data-mark]');
    const fades = Array.from(stage.querySelectorAll('[data-fade]'));
    const hint = stage.querySelector('[data-hint]');
    const grow = stage.querySelector('[data-grow]');

    const hintLabel = hint && hint.querySelector('[data-hint-label]');
    if (hintLabel) {
      const uline = (on) => { hintLabel.style.borderBottomColor = on ? '#EDE9E4' : 'transparent'; };
      hint.addEventListener('mouseenter', () => uline(true));
      hint.addEventListener('mouseleave', () => uline(false));
      hint.addEventListener('focus', () => uline(true));
      hint.addEventListener('blur', () => uline(false));
    }

    if (hint && !reduce) {
      hint.addEventListener('click', (ev) => {
        ev.preventDefault();
        const from = window.scrollY;
        const to = stage.offsetTop + stage.offsetHeight - window.innerHeight;
        if (to <= from) { window.scrollTo({ top: to }); return; }
        const dur = 2600, t0 = performance.now();
        const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
        const step = (now) => {
          const t = Math.min((now - t0) / dur, 1);
          window.scrollTo(0, from + (to - from) * ease(t));
          if (t < 1) this._skipRaf = requestAnimationFrame(step);
        };
        this._skipRaf = requestAnimationFrame(step);
      });
    }

    if (reduce) {
      stage.style.height = '100vh';
      fades.forEach((el) => { el.style.opacity = '1'; });
      if (grow) grow.style.display = 'none';
      return;
    }

    fades.forEach((el) => { el.style.opacity = '0'; });

    const clamp01 = (v) => Math.min(Math.max(v, 0), 1);
    const seg = (p, a, b) => clamp01((p - a) / (b - a));
    const easeOut = (t) => 1 - Math.pow(1 - t, 3);
    const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

    let target = 0, sm = 0;
    const sticky = stage.querySelector('[data-sticky]');
    this._markCenterDelta = 0;
    const measure = () => {
      const span = Math.max(stage.offsetHeight - window.innerHeight, 1);
      target = clamp01((window.scrollY - stage.offsetTop) / span);

        const group = mark.offsetParent === sticky ? null : mark.offsetParent;
        const markCenter = (group ? group.offsetTop : 0) + mark.offsetTop + mark.offsetHeight / 2;
        this._markCenterDelta = sticky.clientHeight / 2 - markCenter;
      }
    };
    const apply = (p) => {
      // The landing intro owns the mark, the copy and the hint until it has finished —
      // the flock arrives, breathes and rises there, so scroll must not fight it.
      if (!this._introRunning) {
        if (mark) mark.style.transform = 'translateY(0px) scale(1)';
        fades.forEach((el) => { el.style.opacity = '1'; el.style.transform = 'translateY(0px)'; });
        if (hint) {
          const ho = 1 - seg(p, 0.04, 0.2);
          hint.style.opacity = String(ho);
          hint.style.pointerEvents = ho < 0.05 ? 'none' : 'auto';
        }
      }
      // .10 → 1  a hairline appears, widens, then grows up into the next section
      if (grow) {
        const line = seg(p, 0.1, 0.16);
        const wide = easeInOut(seg(p, 0.16, 0.36));
        const tall = easeInOut(seg(p, 0.32, 1));
        grow.style.height = (line * 2 + tall * window.innerHeight * 1.02) + 'px';
        grow.style.width = (44 + wide * 56) + 'vw';
        grow.style.opacity = String(line);
        this._flockOpen = tall > 0.985;
      }
    };
    this._initFlockDrop(grow);

    const frame = () => {
      sm += (target - sm) * 0.14;
      if (Math.abs(target - sm) < 0.0005) sm = target;
      apply(sm);
      this._raf = requestAnimationFrame(frame);

    window.addEventListener('scroll', measure, { passive: true });
    window.addEventListener('resize', measure);

  /**

   * to the flock mark, it breathes twice, then rises to its resting slot as the name appears.
   * Runs only at the top of the page; any scroll input snaps it to its end state.
   */
  _playIntro(mark, fades, hint) {
    const intro = document.querySelector('[data-intro]');
    const birds = intro ? Array.from(intro.querySelectorAll('img')) : [];
    if (!mark || !birds.length) return;

    const D = this._markCenterDelta;
    const big = 'translateY(' + D + 'px) scale(1.72)';
    const rest = 'translateY(0px) scale(1)';
    const EASE = 'cubic-bezier(.16,.84,.44,1)';
    this._introRunning = true;
    this._introTimers = [];
    mark.style.opacity = '0';
    mark.style.transform = big;
    fades.forEach((el) => { el.style.opacity = '0'; el.style.transform = 'translateY(16px)'; });
    if (hint) { hint.style.animation = 'none'; hint.style.opacity = '0'; hint.style.pointerEvents = 'none'; }

    // Each single-bird SVG shares the flock's 4167 artboard and sits dead centre in it, so a
    // bird lands exactly on its counterpart in the mark at scale .5269 plus the offsets below
    // (measured from the artwork, expressed as a fraction of the mark box). The intro birds
    // are sized and placed to the mark's own box, then carry the mark's centred transform —
    // so the hand-off to the flock is a straight cross-fade with nothing moving.
    const SEAT = 0.5269;
    const SEATS = {
      glide: { x: -0.22078, y: 0.21603, from: [-0.78, 0.3], delay: 0 },
      climb: { x: -0.17544, y: -0.22839, from: [0.26, -0.66], delay: 130 },
      land: { x: 0.23336, y: 0.04665, from: [0.82, 0.34], delay: 260 }
    };
    const M = mark.offsetWidth, MH = mark.offsetHeight;
    const at = (dx, dy, s) => 'translateY(' + D + 'px) scale(1.72) translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(' + s.toFixed(4) + ')';
    // Whole sequence runs at 1.33x — every duration and gap below goes through T().
    const T = (ms) => Math.round(ms * 0.75);
    const FLY = T(1050);
    birds.forEach((b) => {
      const s = SEATS[b.getAttribute('data-bird')] || SEATS.glide;
      b.style.width = M + 'px';
      b.style.height = MH + 'px';
      b.style.left = mark.offsetLeft + 'px';
      b.style.top = mark.offsetTop + 'px';
      // Entry point is pushed off-frame in the mark's own scaled space.
      const fx = s.from[0] * window.innerWidth / 1.72;
      const fy = s.from[1] * window.innerHeight / 1.72;
      b.animate([
        { transform: at(fx, fy, SEAT * 2.4), opacity: 0 },
        { opacity: 1, offset: 0.22 },
        { transform: at(s.x * M, s.y * MH, SEAT), opacity: 1 }
      ], { duration: FLY, delay: T(s.delay), easing: EASE, fill: 'both' });
    });

    const after = (ms, fn) => { this._introTimers.push(setTimeout(fn, ms)); };
    const land = FLY + T(260);
    after(land, () => {
      // Hard swap, not a cross-fade: the birds sit exactly on the flock, and two half-opaque
      // copies of the same shape composite to ~75% coverage — which reads as a flash.
      mark.style.opacity = '1';
      birds.forEach((b) => {
        if (b.getAnimations) b.getAnimations().forEach((a) => a.cancel());
        b.style.opacity = '0';
      });
      if (intro) intro.style.display = 'none';
    });

    // One breath: 780ms inhale, .5s held at the top — 1s of stillness after the birds land
    // before it starts. The exhale is not a separate beat: the mark releases straight out of
    // the peak into its resting slot, so the shrink and the float are one continuous move.
    const peak = 'translateY(' + (D - 22) + 'px) scale(1.89)';
    // The breath alone runs 1.5x longer than the rest of the sequence.
    const INHALE = T(1170);
    const BREATH = INHALE + T(750);
    const breatheAt = land + T(1000);
    after(breatheAt, () => {
      mark.animate([
        { transform: big, easing: 'cubic-bezier(.32,0,.42,1)' },
        { transform: peak, offset: INHALE / BREATH },
        { transform: peak }
      ], { duration: BREATH, fill: 'forwards' });
    });

    const riseAt = breatheAt + BREATH + T(250);
    const RISE = T(2375);
    after(riseAt, () => {
      mark.animate([{ transform: peak }, { transform: rest }], { duration: RISE, easing: 'cubic-bezier(.42,0,.18,1)', fill: 'forwards' });
      fades.forEach((el, i) => {
        el.animate([
          { opacity: 0, transform: 'translateY(16px)' },
          { opacity: 1, transform: 'translateY(0px)' }
        ], { duration: T(680), delay: T(1400 + i * 140), easing: EASE, fill: 'forwards' });
      });
      if (hint) hint.animate([{ opacity: 0 }, { opacity: 1 }], { duration: T(500), delay: T(2000), easing: EASE, fill: 'forwards' });
    });

    const end = () => {
      if (!this._introRunning) return;
      this._introRunning = false;
      this._introTimers.forEach(clearTimeout);
      [mark].concat(fades, hint ? [hint] : []).forEach((el) => {
        if (el && el.getAnimations) el.getAnimations().forEach((a) => a.cancel());
      });
      mark.style.opacity = '1';
      mark.style.transform = rest;
      fades.forEach((el) => { el.style.opacity = '1'; el.style.transform = 'translateY(0px)'; });
      if (hint) { hint.style.opacity = '1'; hint.style.pointerEvents = 'auto'; }
      if (intro) intro.style.display = 'none';
      ['wheel', 'touchmove', 'keydown'].forEach((ev) => window.removeEventListener(ev, end));
    };
    after(riseAt + RISE + T(350), end);
    ['wheel', 'touchmove', 'keydown'].forEach((ev) => window.addEventListener(ev, end, { passive: true, once: true }));
  }

  _initFlockDrop(grow) {
    if (!grow) return;
    const birds = Array.from(grow.querySelectorAll('img'));
    if (!birds.length) return;
    const st = birds.map((el) => ({ el, x: 0, y: 0, vx: 0, vy: 0, rot: 0, live: false, drag: false, px: 0, py: 0 }));

    st.forEach((s) => {
      const el = s.el;
      el.style.pointerEvents = 'auto';
      el.style.cursor = 'grab';
      el.style.touchAction = 'none';
      el.style.willChange = 'transform';
      el.addEventListener('pointerenter', () => { if (this._flockOpen) s.live = true; });
      el.addEventListener('pointerdown', (ev) => {
        if (!this._flockOpen) return;
        s.live = true; s.drag = true; s.vx = 0; s.vy = 0;
        s.px = ev.clientX; s.py = ev.clientY;
        try { el.setPointerCapture(ev.pointerId); } catch (e) {}
        el.style.cursor = 'grabbing';
        ev.preventDefault();
      });
      el.addEventListener('pointermove', (ev) => {
        if (!s.drag) return;
        const dx = ev.clientX - s.px, dy = ev.clientY - s.py;
        s.px = ev.clientX; s.py = ev.clientY;
        s.x += dx; s.y += dy;
        s.vx = dx; s.vy = dy;
      });
      const end = () => { if (!s.drag) return; s.drag = false; el.style.cursor = 'grab'; };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('lostpointercapture', end);
    });

    const pad = 18;
    const step = () => {
      const gr = grow.getBoundingClientRect();
      st.forEach((s) => {
        if (!s.live) return;
        if (!this._flockOpen && !s.drag) {
          s.x += (0 - s.x) * 0.18; s.y += (0 - s.y) * 0.18; s.rot += (0 - s.rot) * 0.18;
          s.vx = 0; s.vy = 0;
          if (Math.abs(s.x) < 0.4 && Math.abs(s.y) < 0.4) { s.x = 0; s.y = 0; s.rot = 0; s.live = false; }
          s.el.style.transform = 'translate(' + s.x.toFixed(2) + 'px,' + s.y.toFixed(2) + 'px) rotate(' + s.rot.toFixed(2) + 'deg)';
          return;
        }
        if (!s.drag) {
          s.vy += 0.9;
          s.vx *= 0.99;
          s.x += s.vx; s.y += s.vy;
          s.rot += s.vx * 0.35;
        } else {
          s.rot += (s.vx * 1.2 - s.rot) * 0.15;
        }
        s.el.style.transform = 'translate(' + s.x.toFixed(2) + 'px,' + s.y.toFixed(2) + 'px) rotate(' + s.rot.toFixed(2) + 'deg)';
        const r = s.el.getBoundingClientRect();
        const overB = r.bottom - (gr.bottom - pad);
        if (overB > 0) {
          s.y -= overB;
          if (!s.drag) {
            s.vy = Math.abs(s.vy) > 3 ? -s.vy * 0.3 : 0;
            s.vx *= 0.7;
            if (s.vy === 0) { s.rot += (0 - s.rot) * 0.12; s.vx *= 0.85; }
          }
        }
        const overL = (gr.left + pad) - r.left;
        if (overL > 0) { s.x += overL; if (!s.drag) s.vx = Math.abs(s.vx) * 0.45; }
        const overR = r.right - (gr.right - pad);
        if (overR > 0) { s.x -= overR; if (!s.drag) s.vx = -Math.abs(s.vx) * 0.45; }
        const overT = (gr.top + pad) - r.top;
        if (overT > 0) { s.y += overT; if (!s.drag) s.vy = Math.abs(s.vy) * 0.3; }
        s.el.style.transform = 'translate(' + s.x.toFixed(2) + 'px,' + s.y.toFixed(2) + 'px) rotate(' + s.rot.toFixed(2) + 'deg)';
      });
      // birds bump each other
      for (let pass = 0; pass < 2; pass++) {
        for (let i = 0; i < st.length; i++) {
          for (let j = i + 1; j < st.length; j++) {
            const a = st[i], b = st[j];
            if (!a.live && !b.live) continue;
            const ra = a.el.getBoundingClientRect(), rb = b.el.getBoundingClientRect();
            const ax = ra.left + ra.width / 2, ay = ra.top + ra.height / 2;
            const bx = rb.left + rb.width / 2, by = rb.top + rb.height / 2;
            const rad = (Math.min(ra.width, ra.height) + Math.min(rb.width, rb.height)) / 2 * 0.62;
            let dx = bx - ax, dy = by - ay;
            let d = Math.hypot(dx, dy);
            if (d === 0) { dx = 1; dy = 0; d = 1; }
            if (d >= rad) continue;
            const nx = dx / d, ny = dy / d, push = (rad - d);
            const aFixed = a.drag || !a.live, bFixed = b.drag || !b.live;
            const share = aFixed || bFixed ? 1 : 0.5;
            if (!aFixed) { a.x -= nx * push * share; a.y -= ny * push * share; a.live = true; }
            if (!bFixed) { b.x += nx * push * share; b.y += ny * push * share; b.live = true; }
            const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
            if (rel < 0) {
              const imp = -rel * 0.42;
              if (!aFixed) { a.vx -= nx * imp; a.vy -= ny * imp; a.rot -= imp * 0.8; }
              if (!bFixed) { b.vx += nx * imp; b.vy += ny * imp; b.rot += imp * 0.8; }
            }
            if (!aFixed) a.el.style.transform = 'translate(' + a.x.toFixed(2) + 'px,' + a.y.toFixed(2) + 'px) rotate(' + a.rot.toFixed(2) + 'deg)';
            if (!bFixed) b.el.style.transform = 'translate(' + b.x.toFixed(2) + 'px,' + b.y.toFixed(2) + 'px) rotate(' + b.rot.toFixed(2) + 'deg)';
          }
        }
      }
      this._flockRaf = requestAnimationFrame(step);
    };
    this._flockRaf = requestAnimationFrame(step);
  }

  componentWillUnmount() {
    if (this._flockRaf) cancelAnimationFrame(this._flockRaf);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._skipRaf) cancelAnimationFrame(this._skipRaf);
    if (this._measure) {
      window.removeEventListener('scroll', this._measure);
      window.removeEventListener('resize', this._measure);
    }
    window.removeEventListener('scroll', this._onScroll);
    if (this._scaleFrames) {
      window.removeEventListener('resize', this._scaleFrames);
      window.removeEventListener('load', this._scaleFrames);
    }
    if (this._ro) this._ro.disconnect();
    if (this._muteTimer) clearInterval(this._muteTimer);
    this._chatStop = true;
    if (this._chatT) clearTimeout(this._chatT);
    if (this._chatIo) this._chatIo.disconnect();
    if (this._mo) this._mo.disconnect();
    if (this._io) this._io.disconnect();
  }
}
</script>
</body>
