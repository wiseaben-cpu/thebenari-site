<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>benjiwise.com</title>
<!-- TEMPORARY LANDING PAGE.
     This replaces the real portfolio landing page. To put it back:

         git checkout HEAD -- index.html && python3 scripts/apply_meta.py

     (or `git checkout <commit-before-this-one> -- index.html` once it is committed)

     Deliberately standalone: no support.js, no design-system CSS, no generated
     <head> block. That last part matters — the real page's JSON-LD describes a
     portfolio, and emitting it over a photo would be a false claim about the page.
     Because apply_meta.py's anchor (<script src="./support.js">) is absent here,
     that script reports SKIPPED index.html and exits non-zero rather than
     injecting it. That is the intended, loud behaviour while this page is up.

     noindex keeps a placeholder out of search results. The image has all EXIF
     stripped (the original carried GPS coordinates) and is resized from
     4032x3024 to 1350x1800. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/flock-blue.svg" type="image/svg+xml">
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0352BA;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  img {
    max-width: 100%;
    max-height: 100vh;
    max-height: 100dvh;   /* dvh keeps it clear of mobile browser chrome */
    width: auto;
    height: auto;
    display: block;
    object-fit: contain;
  }
</style>
</head>
<body>
<img src="assets/hero.jpg" alt="">
</body>
</html>
